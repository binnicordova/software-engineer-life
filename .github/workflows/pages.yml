name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Content check (quality gate)
        run: node tools/check.mjs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Absolute URLs for link previews
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node tools/build-ending-pages.mjs
          sed -i "s#content=\"og.jpg\"#content=\"${SITE_URL}/og.jpg\"#" public/index.html
          grep -n 'og:image' public/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
